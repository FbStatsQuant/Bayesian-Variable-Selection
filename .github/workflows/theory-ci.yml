name: theory-ci

on:
  push:
    branches: [main, 'infra/**']
    paths-ignore:
      - '**/*.pdf'
      - 'Theory_work/Wave3/WATCHDOG.md'
      - 'Theory_work/Wave3/HQ_*.md'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

concurrency:
  group: theory-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  issues: write

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      BVS_NUMERICS_PY: python
      # C-PACK/numerics/item1_um_checks.py hardcodes a Windows path (C:\\Users\\...\\W1-N3\\numerics) for `import n3lib`;
      # on Linux the same committed module is found through PYTHONPATH (script directory still comes first).
      PYTHONPATH: ${{ github.workspace }}/Theory_work/Wave1/W1-N3/numerics
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: Theory_work/INFRA/ci/requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r Theory_work/INFRA/ci/requirements-ci.txt

      - name: Theory CI (check, paper, falsify, cite)
        run: python Theory_work/INFRA/ci/run_ci.py --steps check,paper,falsify,cite --out ci_out

      - name: Upload CI output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci_out
          path: ci_out
          if-no-files-found: warn

      - name: Open or update the CI HOLD issue
        if: failure() && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'CI HOLD: theory CI failing on main';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let summary = '(ci_out/SUMMARY.md was not produced; see the run log)';
            try { summary = fs.readFileSync('ci_out/SUMMARY.md', 'utf8'); } catch (e) {}
            // failing steps only: sections "## <step>: FAIL (...)" up to the next "## "
            const parts = summary.split(/^(?=## )/m);
            let failing = parts.filter(p => /^## \S+: FAIL/.test(p)).join('\n').trim();
            if (!failing) failing = summary;
            if (failing.length > 50000) failing = failing.slice(0, 50000) + '\n... (truncated; full text in the ci_out artifact)';
            const body = `Theory CI failed (${context.eventName}, commit ${context.sha.slice(0, 7)}).\n\nRun: ${runUrl}\n\n### Failing steps (from SUMMARY.md)\n\n${failing}`;
            const {owner, repo} = context.repo;
            const open = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state: 'open', labels: 'ci-hold', per_page: 100});
            const existing = open.find(i => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({owner, repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({owner, repo, title, body, labels: ['ci-hold', 'theory']});
            }
