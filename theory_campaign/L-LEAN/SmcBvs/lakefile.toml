name = "SmcBvs"
version = "0.1.0"
defaultTargets = ["SmcBvs"]
# Shared Mathlib checkout on Felipe's laptop (built oleans). To rebuild elsewhere,
# delete this line and run `lake exe cache get` (Mathlib rev pinned in lake-manifest.json).
packagesDir = "C:/lean/packages/v4.35.0-rc2"

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc2"

[[lean_lib]]
name = "SmcBvs"
